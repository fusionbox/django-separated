[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "django-separated"
version = "1.1.1.dev0"
description = "Class-based view and mixins for handling CSV with Django."
readme = "README.rst"
authors = [{name = "Fusionbox, Inc.", email = "programmers@fusionbox.com"}]
keywords = ["django", "csv", "class-based", "views"]
requires-python = ">=3.8"
dependencies = ["Django>=2.0", "unicodecsv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Topic :: Internet :: WWW/HTTP",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/fusionbox/django-separated"

[tool.setuptools]
packages = ["separated"]

[tool.isort]
multi_line_output = 5
lines_after_imports = 2
